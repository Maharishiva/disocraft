[project]
name = "disocraft"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chex>=0.1.91",
    "craftax",
    "disco-rl",
    "dm-env>=1.6",
]

[tool.uv.workspace]
members = [
    "external/disco_rl",
    "external/Craftax",
]

[tool.uv.sources]
disco-rl = { workspace = true }
craftax = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "external",
    ".venv",
    "runs",
]
